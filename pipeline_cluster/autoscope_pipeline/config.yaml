
#rule subtract background
do_inverse: True

# rule binarize with contours: threshold : 40 (standart)
threshold : 40
max_value : 255
blur : 3  #needs to be odd
contour_size : 80000
tolerance : 0.5
inner_contour_to_fill : 20000


# rule tiff2avi:
fourcc : 0
fps : 30
downdownsample_for_DLC : 1  #downdownsample_for_DLC 1 = yes 0 = no -> will downsample video to 512 for DLC to track head and tail properly

#rule dlc_analyze_videos:
dlc_model_configfile_path : "/scratch/neurobiology/zimmer/schaar/code/DLC/nose_tail_vulva-Ben-2023-10-11/config.yaml"
network_string : "DLC_mobnet_35_nose_tail_vulvaOct11shuffle1_500000" # You might need to run the code to find out how the string looks like

#rule create_centerline:
# rule create centerline
nose : "nose" # how was the nose annotated as in DLC model? e.g. head, nose, Head, Nose, etc..
tail : "tail" # how was the tail annotated as in DLC model?
num_splines : 100
number_of_neighbours : 1
fill_with_DLC : 1

#rule annotate_behaviour:
pca_model_path : "/scratch/neurobiology/zimmer/ulises/code/curvature/curvature/models/1550_20230202_eigenworm_PCA_bodypart_30_to_80.pkl"
initial_segment : 30
final_segment : 80
window : 10