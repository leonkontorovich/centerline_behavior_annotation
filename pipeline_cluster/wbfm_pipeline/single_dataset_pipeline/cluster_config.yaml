# Example from: https://hackmd.io/@bluegenes/BJPrrj7WB
# cluster_config.yml - cluster configuration
__default__:
    time: 0-08:00:00
    partition: basic
    nodes: 1
    cpus_per_task: 4
    mem: 8G
    disk_mb: 8000
    mem_mb: 8000
    output: log/log_%x_%A_%a_%j.out
    gres: # Should be empty

