# ------------------------------------------------------------------
# WHICH COPY OF THE PYTHON PACKAGE THIS RUN USES.
#
# The Snakefile's rules `import centerline_behavior_annotation...`. That import
# is resolved by Python, NOT by the pipeline -- so it lands on whatever copy is
# installed in the active conda env, which on the lab cluster is the SHARED lab
# checkout, even when every other file came from your own clone. Your fixes to
# centerline/ or curvature/ would then be silently ignored.
#
# This path is stamped automatically by copy_aerotaxis_population_pipeline.sh /
# setup_aerotaxis_dataset.py with the root of the clone they were run from, and
# the Snakefile puts it FIRST on sys.path. Every run prints the resolved package
# location as a `[repo]` line -- check it if you are ever unsure which code ran.
#
# Leave empty to accept whatever the environment provides (the Snakefile then
# warns, since that is the situation this key exists to prevent).
# ------------------------------------------------------------------
centerline_repo_path: ""

# Video processing parameters
fourcc: 0

# ------------------------------------------------------------------
# fps and factor_px_to_mm are SOURCED FROM SWC, not from here.
# The Snakefile reads each recording's SWC parameters.yaml
# ({dataset}/parameters.yaml, written by SimpleWormCropper) and uses:
#   fps             <- recording.fps
#   factor_px_to_mm <- recording.pixel_size_mm  (SWC's exact px->mm),
#                      or arena_size_cm*10 / frame_height_px if that key is
#                      absent (older SWC that didn't persist pixel_size_mm).
# The two values below are FALLBACKS ONLY, used when parameters.yaml is missing
# (e.g. hand-assembled datasets). Keep them sane but do not tune them per
# recording -- tune SWC instead, and the pipeline will follow.
# NB: swc_config.json's hardware `um_per_pixel` is a SEPARATE crop-buffer
# calibration -- it is NOT the velocity calibration; do not use it here.
# ------------------------------------------------------------------
fps: 10                        # fallback only; real value from SWC parameters.yaml
factor_px_to_mm: '0.01221'     # fallback only; real value from SWC parameters.yaml
                               # (2.5 cm arena / 2048 px = 25/2048 = 0.01221 mm/px)

# Model paths and settings
dlc_model_configfile_path: /lisc/data/scratch/neurobiology/zimmer/schaar/code/DLC/population_nose_neck_vulva_tail_elpiniki_chanuka_itamar-elpi-2024-09-23/config.yaml
dlc_conda_env_path: /lisc/opt/sw/software/Conda/Miniforge3/envs/DeepLabCut-2.3.11
network_string: DLC_resnet50_population_nose_neck_vulva_tail_elpiniki_chanuka_itamarSep23shuffle2_1030000
pca_model_path: /lisc/data/scratch/neurobiology/zimmer/autoscope/trained_models/PCA_models/equi_distance_centerline_seg_10_40.pkl

# SAM2 parameters
downsample_factor: 0
batch_size: 200

# Worm detection parameters
# min/max_worm_area are FALLBACKS -- the real values come from SWC
# parameters.yaml (region_extraction.min/max_region_size) per recording.
min_worm_area: 400
max_worm_area: 1000

# Minimum worm length as BIOLOGY (mm), converted to pixels per recording using
# SWC's px->mm calibration. Frames whose skeleton is shorter are blanked by
# create_centerline.
#
# This is a JUNK FLOOR: it rejects debris and broken mask fragments, so it must
# sit well below any real worm (an adult images at ~0.8-1.1 mm). Do NOT raise it
# to select for worm size -- that is what the analysis-time aliveness gate is
# for.
#
# It replaces the old `min_worm_lenght: 83`, a PIXEL constant tuned on a rig
# where worms imaged at ~1.0 mm. On a dataset whose worms imaged at ~60-70 px
# it silently blanked ~99% of frames and cost a full pipeline run. Pixel
# thresholds do not travel between rigs; millimetre thresholds do.
#
# 0.30 is MEASURED, not guessed: calibrate_min_worm_length.py over five
# recordings of the rde4_behavior dataset put median worm length at 0.76-1.24 mm
# and recommended 0.32-0.46 mm per recording. We take 0.30 -- at or below every
# recording's own recommendation -- because those recommendations are biased
# upward (see the script's CAVEATS) and because over-culling is the failure mode
# that destroys a dataset, while stray debris is removed downstream anyway for
# free. At 0.01221 mm/px that is ~25 px, far above a debris fragment.
#
# Re-run step 4a on YOUR data before trusting this on a different rig or stage.
min_worm_length_mm: 0.30

# Annotation parameters
nose: head
tail: tail
num_splines: 20
initial_segment: 9
final_segment: 39

#preprocess spline
relative_spacing: 2.0  # 2% of skeleton length
num_sampled_points: 10000
smoothing: 0
time_sigma: 2.0
spatial_sigma: 1.0
max_columns: 0 #dynamic mode - cuts skelleton where nan content increases 50%+

window: 10
min_round_threshold: 0.55
max_round_threshold: 0.99
upper_threshold: '0.000001'
lower_threshold: '-0.00001'

# ============================================================
# Aerotaxis temporal-alignment parameters
# Global plate-level gas protocol. Edit freely per assay / paradigm.
# Protocol = one baseline block, then `cycle` (an ordered list of phases)
# repeated until the recording ends (or n_cycles times, if set).
# Alignment uses the ABSOLUTE recording time from the SWC track.txt
# (time_imputed_seconds), so crops that start at different times all lock to
# the same global protocol. fps comes from the top-level `fps` key above.
# ============================================================
aerotaxis:
  t0_offset_s: 0.0             # absolute recording time (s) at which the protocol starts
                               # (0 = protocol begins at recording t=0; frames before it -> "pre_protocol")
  baseline_duration_s: 240     # 4-min baseline
  baseline_state: "7pct_O2"
  cycle:                       # one repeating unit; phases applied in order
    - {state: "21pct_O2", duration_s: 30}   # pulse
    - {state: "7pct_O2",  duration_s: 60}    # return
  n_cycles: null               # null = repeat to end of recording; or an int to cap