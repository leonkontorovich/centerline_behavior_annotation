# Example from: https://hackmd.io/@bluegenes/BJPrrj7WB
# cluster_config.yml - cluster configuration
# For the actual available resources, see the cluster documentation:
# https://lisc.univie.ac.at/wiki/content/working_environment/services/computational_resources

__default__:
    time: 1-0:00:00
    nodes: 1
    cpus_per_task: 16
    mem: 128G
    output: log_snakemake_step-%j.out
    mail_type: FAIL,TIME_LIMIT
    gres: null # Should be null
    constraint: "hdd|ssd" # Dummy values, because it can't be empty
    no-requeue: "" # Should be empty

# Note: may need to push over to himem if the cluster is busy
preprocessing:
    time: 2-12:00:00
    mem: 120G
    cpus_per_task: 40

segmentation:
    time: 2-12:00:00
    mem: 256G
    cpus_per_task: 40

alt_segmentation:
    time: 2-12:00:00
    mem: 256G
    cpus_per_task: 40

match_frame_pairs:
    time: 1-12:00:00
    mem: 128G
    gres: gpu:1
    constraint: "l40s|a30|t4|v100|l4"

build_frame_objects:
    time: 1-12:00:00
    cpus_per_task: 20
    mem: 128G

alt_build_frame_objects:
    time: 1-12:00:00
    cpus_per_task: 20
    mem: 128G

postprocess_matches_to_tracklets:
    cpus_per_task: 1
    time: 0-6:00:00
    gres: gpu:1
    constraint: "l40s|a30|t4|v100|l4"

combine_tracking_and_tracklets:
    time: 1-18:00:00
    cpus_per_task: 20

tracking:
    time: 1-00:00:00
    cpus_per_task: 16
    gres: gpu:1
    constraint: "l40s|a30|t4|v100|l4"

barlow_tracking:
    cpus_per_task: 16
    gres: gpu:1
    constraint: "l40s|a30|t4|v100|l4"

barlow_embedding:
    cpus_per_task: 16
    gres: gpu:1
    constraint: "l40s|a30|t4|v100|l4"

alt_barlow_embedding: 
    cpus_per_task: 16
    gres: gpu:1
    constraint: "l40s|a30|t4|v100|l4"

extract_full_traces:
    time: 1-12:00:00
    cpus_per_task: 56
    mem: 256G

