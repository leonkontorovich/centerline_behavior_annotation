# Reproducible environment for the AEROTAXIS ANALYSIS + ORCHESTRATION layer.
#
# This covers everything that is NOT the GPU inference stack: the Snakemake
# controller, the temporal-feature extractor, create_results_dict_server, the
# population analysis (aerotaxis_analysis.py), the pytest suite, and the notebook.
# It deliberately does NOT include SAM2 or DeepLabCut -- those GPU envs live on
# the cluster and are captured separately (see conda/README.md).
#
# Create:   conda env create -f conda/aerotaxis_analysis.yaml
# Activate: conda activate aerotaxis_analysis
#
# Floors (>=) are used rather than exact build strings so the env stays solvable
# over time; verified working with the versions in the comments (Python 3.12).
name: aerotaxis_analysis
channels:
  - conda-forge
dependencies:
  - python >=3.10,<3.13        # verified on 3.12
  - numpy >=1.24,<2            # verified 1.26
  - pandas >=2.0               # verified 2.2
  - scipy >=1.10               # verified 1.13 (Benjamini-Hochberg check)
  - pyarrow >=12               # parquet results table; verified 16
  - seaborn >=0.12
  - matplotlib-base >=3.7
  - tqdm >=4.65
  - pyyaml >=6.0
  - tifffile >=2023.1
  - snakemake-minimal >=7.18   # the pipeline was authored against 7.x
  - ipywidgets >=8.0           # per-crop notebook viewer
  - jupyter
  - pytest >=7.0               # tests/ suite
